<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>P2P Chat</title>

    <link
        rel="stylesheet"
        href="./style.css"
    >
</head>

<body>

    <div class="app">

        <aside class="sidebar">

            <h1>P2P CHAT</h1>

            <section class="connection-panel">

                <h3>自分のPeer ID</h3>

                <code id="my-id">
                    接続中...
                </code>

                <h3>相手のPeer ID</h3>

                <input
                    id="peer-id"
                    type="text"
                    placeholder="相手のPeer ID"
                >

                <button
                    id="connect"
                    type="button"
                >
                    接続
                </button>

                <p id="status">
                    PeerServerに接続しています...
                </p>

            </section>

        </aside>


        <main class="chat">

            <header class="chat-header">

                <h2>メッセージ</h2>

                <button
                    id="debug-toggle"
                    type="button"
                >
                    ⚙ デバッグ
                </button>

            </header>


            <div
                id="messages"
                class="messages"
            >
                <!-- メッセージがここに追加される -->
            </div>


            <div class="message-input">

                <input
                    id="message"
                    type="text"
                    placeholder="メッセージを入力"
                >

                <!-- 添付ファイル選択 -->
                <input
                    id="file"
                    type="file"
                    hidden
                >

                <!-- 添付ボタン -->
                <button
                    id="attach"
                    type="button"
                >
                    📎 添付
                </button>

                <!-- 送信ボタン -->
                <button
                    id="send"
                    type="button"
                >
                    送信
                </button>

            </div>

        </main>

    </div>


    <!-- ================================ -->
    <!-- デバッグパネル -->
    <!-- ================================ -->

    <div
        id="debug-panel"
        class="debug-panel"
        hidden
    >

        <div class="debug-header">

            <h2>デバッグ</h2>

            <button
                id="debug-close"
                type="button"
            >
                ×
            </button>

        </div>


        <div class="debug-content">

            <h3>PeerJS</h3>

            <div class="debug-item">

                <span>
                    Peer状態
                </span>

                <span id="debug-peer-status">
                    ---
                </span>

            </div>


            <div class="debug-item">

                <span>
                    Peer ID
                </span>

                <code id="debug-peer-id">
                    ---
                </code>

            </div>


            <h3>WebRTC / ICE</h3>

            <div class="debug-item">

                <span>
                    ICE状態
                </span>

                <span id="debug-ice-state">
                    ---
                </span>

            </div>


            <div class="debug-item">

                <span>
                    接続状態
                </span>

                <span id="debug-connection-state">
                    ---
                </span>

            </div>


            <h3>接続候補</h3>

            <div class="debug-item">

                <span>
                    Host
                </span>

                <span id="debug-host">
                    ---
                </span>

            </div>


            <div class="debug-item">

                <span>
                    STUN / srflx
                </span>

                <span id="debug-srflx">
                    ---
                </span>

            </div>


            <div class="debug-item">

                <span>
                    TURN / relay
                </span>

                <span id="debug-relay">
                    ---
                </span>

            </div>


            <h3>接続経路</h3>

            <div class="debug-item">

                <span>
                    Local
                </span>

                <span id="debug-local-candidate">
                    ---
                </span>

            </div>


            <div class="debug-item">

                <span>
                    Remote
                </span>

                <span id="debug-remote-candidate">
                    ---
                </span>

            </div>


            <h3>接続先</h3>

            <div class="debug-item">

                <span>
                    相手Peer ID
                </span>

                <code id="debug-remote-peer">
                    ---
                </code>

            </div>


            <h3>内部ログ</h3>

            <pre
                id="debug-log"
                class="debug-log"
            >起動しました。</pre>

        </div>

    </div>


    <!-- ================================ -->
    <!-- JavaScript -->
    <!-- ================================ -->

    <script src="./main.js"></script>
    <script src="./debug.js"></script>
    <script src="./chat.js"></script>
    <script src="./peer.js"></script>

</body>
</html>
